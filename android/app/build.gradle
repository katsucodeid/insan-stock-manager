plugins {
    id 'com.android.application'
}

android {
    namespace 'id.katsucode.insan'
    compileSdk 35

    defaultConfig {
        applicationId 'id.katsucode.insan'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
