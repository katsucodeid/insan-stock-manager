<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>INSAN Stock Manager</title><link rel="manifest" href="manifest.json">
<style>
:root{font-family:system-ui,Arial;color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--text:#edf3fc;--muted:#9aabc2;--line:#26364d;--accent:#5b9cff;--danger:#ff7373}
:root.light{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--text:#172235;--muted:#65758c;--line:#dce4ef;--accent:#246ee9;--danger:#c93636}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{padding:18px;display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:auto}main{max-width:900px;margin:auto;padding:0 16px 40px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.muted{color:var(--muted);font-size:13px}.qty{font-size:25px;font-weight:750;margin-top:5px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}input,select,button,textarea{font:inherit;border-radius:10px;padding:11px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;margin:5px 0}button{background:var(--accent);color:white;border:0;font-weight:650;cursor:pointer}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}label{font-size:13px;color:var(--muted)}h2{font-size:17px;margin:0 0 10px}.hidden{display:none}.ok{color:#39c98a}.low{color:var(--danger)}textarea{min-height:190px}small{color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{min-width:100px}
</style></head><body>
<header><div><b>INSAN STOCK MANAGER</b><div class="muted">Inventaris bersama</div></div><button class="secondary" style="width:auto" onclick="toggleTheme()">◐ Tema</button></header>
<main>
<section id="login" class="panel"><h2>Masuk</h2><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">Login</button><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden">
<div class="row"><div><b id="who"></b><div class="muted">Data disinkronkan melalui server</div></div><button class="secondary" style="max-width:110px" onclick="logout()">Keluar</button></div>
<div class="tabs"><button onclick="showTab('dashboard')">Stok</button><button onclick="showTab('incoming')">Paket datang</button><button onclick="showTab('production')">Target</button><button onclick="showTab('report')">Laporan</button><button onclick="showTab('history')">Riwayat</button></div>
<div id="dashboard" class="tab panel"><h2>Stok terkini</h2><div id="stockGrid" class="grid"></div><button class="secondary" onclick="refresh()">↻ Segarkan</button></div>
<div id="incoming" class="tab panel hidden"><h2>Barang datang</h2><label>Barang</label><select id="inItem"><option value="box3">Box isi 3</option><option value="box5outer">Box isi 5 luar / Slongsong</option><option value="box5inner">Box isi 5 dalam / Tatakan polos</option><option value="paper">Kertas Minyak</option><option value="mika">Mika roti roll</option></select><div class="row"><div><label>Jumlah pack</label><input id="packs" type="number" min="0" value="0"></div><div><label>Isi per pack (pcs)</label><input id="perPack" type="number" min="0" value="0"></div><div><label>Tambahan pcs</label><input id="extra" type="number" min="0" value="0"></div></div><label>Catatan</label><input id="inNote" placeholder="Contoh: Paket datang pagi"><button onclick="stockIn()">Simpan barang datang</button><p id="inMsg" class="muted"></p></div>
<div id="production" class="tab panel hidden"><h2>Target produksi</h2><div class="row"><div><label>Tanggal</label><input id="prodDate" type="date"></div><div><label>Lokasi</label><input id="location" placeholder="Grand Wisata / Bekasi Timur"></div></div><div class="row"><div><label>Ori (loyang)</label><input id="ori" type="number" min="0" value="0"></div><div><label>Beef (loyang)</label><input id="beef" type="number" min="0" value="0"></div><div><label>Spicy (loyang)</label><input id="spicy" type="number" min="0" value="0"></div></div><label><input id="customEnabled" type="checkbox" style="width:auto" onchange="document.getElementById('customFields').classList.toggle('hidden',!this.checked)"> Gunakan request kemasan khusus (menggantikan hitungan normal)</label><div id="customFields" class="hidden"><div class="row"><div><label>Box isi 3</label><input id="cBox3" type="number" min="0" value="0"></div><div><label>Box isi 5 (luar & dalam)</label><input id="cBox5" type="number" min="0" value="0"></div><div><label>Kertas minyak</label><input id="cPaper" type="number" min="0" value="0"></div></div><small>Contoh: request 9 box isi 5, 1 box isi 3 → isi Box isi 3 = 1, Box isi 5 = 9, kertas = 9.</small></div><label>Catatan</label><input id="prodNote" placeholder="Catatan target"><button onclick="production()">Simpan target & kurangi stok</button><p id="prodMsg" class="muted"></p></div>
<div id="report" class="tab panel hidden"><h2>Laporan INSAN siap salin</h2><textarea id="reportText" readonly></textarea><button onclick="copyReport()">Salin laporan</button><button class="secondary" onclick="loadReport()">Perbarui laporan</button></div>
<div id="history" class="tab panel hidden"><h2>Riwayat terbaru</h2><div id="historyList"></div></div>
</section></main>
<script src="config.js"></script><script>
const API=(window.INSAN_CONFIG?.API_BASE||"").replace(/\/$/,"");let token=localStorage.getItem("insan_token");let state=null;
function themeInit(){if(localStorage.getItem("insan_theme")==="light")document.documentElement.classList.add("light")}function toggleTheme(){document.documentElement.classList.toggle("light");localStorage.setItem("insan_theme",document.documentElement.classList.contains("light")?"light":"dark")}themeInit();
async function call(path,opts={}){const r=await fetch(API+"/api"+path,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"Permintaan gagal");return d}
async function login(){try{const d=await call("/auth/login",{method:"POST",body:JSON.stringify({username:username.value,password:password.value})});token=d.token;localStorage.setItem("insan_token",token);await refresh()}catch(e){loginMsg.textContent=e.message}}
function logout(){token=null;localStorage.removeItem("insan_token");app.classList.add("hidden");login.classList.remove("hidden")}
async function refresh(){try{state=await call("/state");login.classList.add("hidden");app.classList.remove("hidden");who.textContent=state.user.username+" · "+state.user.role;renderStock();renderHistory();await loadReport()}catch(e){logout();loginMsg.textContent=e.message}}
function renderStock(){stockGrid.innerHTML=Object.entries(state.stock).map(([k,v])=>{const def=state.itemDefs[k];return `<div class="panel"><div class="muted">${def.label}</div><div class="qty">${Number(v).toLocaleString("id-ID")} pcs</div><div class="${def.min!==null&&v<def.min?'low':'ok'} muted">${def.min===null?'Batas minimum belum ditetapkan':v<def.min?'Di bawah minimum '+def.min:'Aman · minimum '+def.min}</div></div>`}).join("")}
function showTab(id){document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");if(id==="report")loadReport()}
async function stockIn(){try{const d=await call("/stock-in",{method:"POST",body:JSON.stringify({item:inItem.value,packs:+packs.value,perPack:+perPack.value,extra:+extra.value,note:inNote.value})});inMsg.textContent="Berhasil menambahkan "+d.total.toLocaleString("id-ID")+" pcs.";await refresh()}catch(e){inMsg.textContent=e.message}}
async function production(){try{const body={date:prodDate.value,location:location.value,ori:+ori.value,beef:+beef.value,spicy:+spicy.value,note:prodNote.value};if(customEnabled.checked)body.custom={enabled:true,box3:+cBox3.value,box5:+cBox5.value,paper:+cPaper.value};const d=await call("/production",{method:"POST",body:JSON.stringify(body)});prodMsg.textContent="Target tersimpan: "+d.totalLoyang+" loyang. Stok sudah dikurangi.";await refresh()}catch(e){prodMsg.textContent=e.message}}
async function loadReport(){try{const d=await call("/report");reportText.value=d.report}catch(e){reportText.value=e.message}}
async function copyReport(){await navigator.clipboard.writeText(reportText.value);alert("Laporan disalin.")}
function renderHistory(){historyList.innerHTML=state.history.map(x=>`<div class="panel"><b>${x.type==="stock-in"?"Barang masuk":"Target produksi"}</b><div class="muted">${x.date||""} · ${x.location||x.createdBy||""}</div><small>${JSON.stringify(x.lines)}</small></div>`).join("")||"Belum ada riwayat."}
prodDate.value=new Date().toISOString().slice(0,10);if(token)refresh();
</script></body></html>
